<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OS Quest</title><style>*{box-sizing:border-box}body{margin:0;background:#090e1c;color:#e5eaff;font:16px system-ui;line-height:1.6}header{position:sticky;top:0;background:#111a30;padding:12px 18px;z-index:2;border-bottom:1px solid #33456b}main{max-width:760px;margin:auto;padding:20px 16px 90px}h1,h2,h3{line-height:1.2}h1{color:#b6a4ff}small{color:#9caed0}section{background:#141e34;border:1px solid #304267;border-radius:16px;padding:18px;margin:12px 0}button,input,select{font:inherit;border-radius:10px;padding:12px;border:1px solid #53638a;background:#202c48;color:#fff}button{cursor:pointer;margin:4px 0}button.primary{background:#7053db;border-color:#a58bff;font-weight:bold}button.option{display:block;width:100%;text-align:left}button:disabled{opacity:.55}nav{position:fixed;bottom:0;left:0;right:0;background:#111a30;display:flex;justify-content:center;gap:5px;padding:8px;z-index:3}nav button{font-size:13px;padding:9px}progress{width:100%;accent-color:#a78bfa}.good{color:#6ee7b7}.bad{color:#fda4af}input{max-width:100%;width:100%}pre{white-space:pre-wrap}</style></head><body><header id="hud"></header><main id="main"></main><nav><button onclick="home()">Campaign</button><button onclick="lab()">Labs</button><button onclick="examMenu()">Exam</button><button onclick="stats()">Stats</button></nav><script src="content.js"></script><script src="game.js"></script></body></html>
